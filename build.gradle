import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode

plugins {
    id 'org.jetbrains.intellij.platform' version '2.20.0'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

group = 'xamgore'
version = '2.1.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdea('2026.2')
        pluginVerifier()
    }
}

kotlin {
    jvmToolchain(25)
    compilerOptions {
        // Use the platform's JVM defaults without bridges to deprecated widget methods.
        jvmDefault = JvmDefaultMode.NO_COMPATIBILITY
    }
}

intellijPlatform {
    buildSearchableOptions = false

    pluginConfiguration {
        ideaVersion {
            sinceBuild = '262.8665.258'
            untilBuild = '263.*'
        }
    }

    pluginVerification {
        // All required APIs ship with the IDE.
        freeArgs = ['-offline']
        ides {
            current()
            create(IntelliJPlatformType.IntellijIdea, '2026.3')
        }
    }
}
